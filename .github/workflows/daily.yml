name: 每日监测

on:
  workflow_dispatch:
    inputs:
      test_push:
        description: 强制测试推送（非交易日也发）
        required: false
        default: 'false'
  schedule:
    - cron: '20 13 * * 1-5'   # UTC 13:20 = 北京 21:20（备用，主触发用 cron-job.org）

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行策略引擎
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_HOST: ${{ secrets.BARK_HOST }}
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
          TEST_PUSH: ${{ github.event.inputs.test_push }}
        run: python src/main.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state.json docs/data.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
